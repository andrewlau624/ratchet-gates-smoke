name: gates
on: [pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: andrewlau624/ratchet-gates@v1
        with:
          advisory: "true"
