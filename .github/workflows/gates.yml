name: gates
on: [pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: g
        uses: andrewlau624/ratchet-gates@v1
      - if: always()
        run: 'echo "action output result=${{ steps.g.outputs.result }}"'
