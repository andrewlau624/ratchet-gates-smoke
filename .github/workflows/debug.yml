name: debug
on: [pull_request]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: pip install --quiet ruff
      - name: git topology
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "parents=$(git rev-parse HEAD^@ | tr '\n' ' ')"
          echo "--- refs ---"; git for-each-ref --format='%(refname)' | head -20
          echo "--- origin/HEAD symbolic-ref ---"; git symbolic-ref --short refs/remotes/origin/HEAD || echo "(none)"
          base="$(git merge-base origin/main HEAD)"
          echo "merge-base=$base"
          echo "--- changed files base...HEAD ---"; git diff --name-only --diff-filter=ACM "$base...HEAD"
          echo "--- unified=0 diff ---"; git diff --unified=0 "$base...HEAD" -- bad.py app.py
          echo "--- ruff on bad.py ---"
          ruff check --config 'lint.extend-select=["PLC0415","TRY400","UP","TID251","ASYNC","RUF006","RUF100","PGH003","PGH004"]' --output-format json bad.py app.py || true
          echo "--- ruff version ---"; ruff --version
